spring.application.name=api
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/soulin?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:soulin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

app.moderation.api-url=${MODERATION_API_URL:https://minseong12-moderation.hf.space/moderate}
app.moderation.connect-timeout-ms=${MODERATION_CONNECT_TIMEOUT_MS:5000}
app.moderation.read-timeout-ms=${MODERATION_READ_TIMEOUT_MS:20000}
app.moderation.fail-open=${MODERATION_FAIL_OPEN:true}

app.crisis-detection.api-url=${CRISIS_DETECTION_API_URL:https://hyuuni.app.n8n.cloud/webhook/crisis-detection}
app.crisis-detection.api-key=${CRISIS_DETECTION_API_KEY:}
app.crisis-detection.connect-timeout-ms=${CRISIS_DETECTION_CONNECT_TIMEOUT_MS:2000}
app.crisis-detection.read-timeout-ms=${CRISIS_DETECTION_READ_TIMEOUT_MS:5000}
app.content-safety.pool-size=${CONTENT_SAFETY_POOL_SIZE:4}
