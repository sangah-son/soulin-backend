spring.datasource.url=jdbc:h2:mem:soulin;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=1209600000

spring.mail.username=test@example.com
spring.mail.password=test-only-password
spring.mail.host=localhost
spring.mail.port=2525
app.mail.from=test@example.com

app.crisis-detection.api-url=http://localhost/crisis-detection
